name: Torappu Excel Auto Update

on:
  schedule:
    - cron: "0 0,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - run: uv sync
        shell: bash

      - name: Download Torappu Excel Data
        id: download-data
        run: |
          uv run ./scripts/auto_update.py
          echo "version=$(cat latest_version.txt)" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check-changes
        run: |
          CLEAN_VERSION=$(echo "${{ steps.download-data.outputs.version }}" | tr '.' '-')
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          
          git add src/torappu_excel/json/*
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto update Torappu Excel data (Version ${{ steps.download-data.outputs.version }})"
          title: "Auto Update Torappu Excel Data (Version ${{ steps.download-data.outputs.version }})"
          body: "Automated PR for updating Torappu Excel data\n**Version**: ${{ steps.download-data.outputs.version }}"
          branch: "auto-update/${{ steps.check-changes.outputs.clean_version }}"
          base: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Failure Notification
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Torappu Excel Update Failed',
              body: 'Automatic update and test workflow failed. Please check the logs.'
            })
