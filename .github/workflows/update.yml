name: Torappu Excel Auto Update

on:
  schedule:
    - cron: "0 0,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - run: uv sync
        shell: bash

      - name: Download Torappu Excel Data
        id: download-data
        run: |
          uv run ./scripts/auto_update.py
          echo "version=$(cat latest_version.txt)" >> $GITHUB_OUTPUT

      - name: Commit changes and push to new branch
        id: commit-changes
        run: |
          CLEAN_VERSION=$(echo "${{ steps.download-data.outputs.version }}" | tr '.' '-')
          echo "Version: $CLEAN_VERSION"  # Added line to output the cleaned version

          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add src/torappu_excel/json/*

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Creating new branch..."
            git checkout -b "auto-update/$CLEAN_VERSION"
            git commit -m "Auto update Torappu Excel data (Version ${{ steps.download-data.outputs.version }})"
            git push origin "auto-update/$CLEAN_VERSION"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "branch_name=auto-update/$CLEAN_VERSION" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: steps.commit-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Auto Update Torappu Excel Data (Version ${{ steps.download-data.outputs.version }})"
          body: "Automated PR for updating Torappu Excel data\n**Version**: ${{ steps.download-data.outputs.version }}"
          branch: "${{ steps.commit-changes.outputs.branch_name }}"
          base: main
          delete-branch: true

      - name: Create Failure Notification
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Torappu Excel Update Failed',
              body: 'Automatic update and test workflow failed. Please check the logs.'
            })
